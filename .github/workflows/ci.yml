name: CI & Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit, Fuzz & Headless Browser E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit, 150-run fuzz, and real headless browser E2E tests
        run: npm test

      - name: Verify automatic standalone HTML bundle build
        run: npm run build:standalone

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble clean static Pages bundle
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r styles src icons _site/
          BUILD_VER="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          sed -i "s/__SW_CACHE_VERSION__/${BUILD_VER}/g" _site/sw.js
          sed -i "s|\./styles/\([^\"']*\.css\)|./styles/\1?v=${BUILD_VER}|g; s|\./src/main\.js|./src/main.js?v=${BUILD_VER}|g" _site/index.html
          echo "Injected SW & asset cache version: ${BUILD_VER}"
          node scripts/build-standalone.mjs _site/slay_the_spire_lite.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
          include-hidden-files: true

      - name: Wait for artifact metadata propagation
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
